[project]
name = "vicarious"
version = "0.1.0"
description = "See through my eyes — pay to watch a live POV stream for 60 seconds."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "opencv-python>=4.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "playwright>=1.49",
]

[tool.uv]
package = false
